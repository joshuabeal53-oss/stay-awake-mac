name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Intentional failing-check acceptance control
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate installer and launcher syntax without executing them
        run: |
          bash -n install.sh
          bash -n 'Install Stay Awake.command'
          bash -n src/jxa-launcher.sh
          node --check src/StayAwake.js
          plutil -lint src/Info.plist src/Info-jxa.plist
      - name: Typecheck Swift without installing or launching the app
        run: xcrun swiftc -parse-as-library -typecheck -target "$(uname -m)-apple-macos13.0" src/StayAwake.swift
